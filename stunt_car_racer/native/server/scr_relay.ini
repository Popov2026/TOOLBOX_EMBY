# Réglages du serveur relais Stunt Car Racer (à côté de scr_relay / scr_relay.exe).
# Le serveur impose ces réglages à tous les jeux qui s'y connectent : tout le monde joue avec la
# même physique, quels que soient les scr.ini des joueurs. Relancez le serveur après modification.
# Stunt Car Racer relay server settings (next to scr_relay / scr_relay.exe).
# The server imposes these settings on every game that connects: everyone plays with the same
# physics, whatever the players' scr.ini say. Restart the server after editing.

port = 27420                  # port TCP d'écoute (relais = adresse:port chez les joueurs) / TCP listening port (players: relais = address:port)

# --- physique (1 = valeur du jeu d'origine) / physics (1 = the original game's value)
gravity = 1                   # gravité / gravity
thrust = 1                    # poussée du moteur / engine thrust
brake = 1                     # freinage / braking
timestep = 1                  # pas de temps de la physique (vitesse du jeu) / physics time step (game speed)
damping = 1                   # amortissement / damping
boostuse = 1                  # consommation du boost (2 = deux fois plus vite) / boost consumption (2 = twice as fast)
shock = 0                     # tolérance aux chocs (dégâts) / impact tolerance (damage)

# --- réseau / network
reseau_cadence = 400          # échanges réseau par seconde dans les jeux (50 à 2000) : plus haut = moins de lag / network exchanges per second in the games (50 to 2000): higher = less lag

# --- codes de licence de la version navigateur / browser version licence codes
# Une ligne par code, donnée par native/tools/encrypt_disk.mjs. Quand un code charge la disquette,
# le journal du serveur l'indique : « CODE DE LICENCE UTILISÉ : « nom » ».
# One line per code, as printed by native/tools/encrypt_disk.mjs. When a code loads the disk, the
# server log says so.
# licence = auteur 0123456789abcdef
