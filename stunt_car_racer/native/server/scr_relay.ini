# Réglages du serveur relais Stunt Car Racer (à côté de scr_relay / scr_relay.exe).
# Le serveur impose ces réglages à tous les jeux qui s'y connectent : tout le monde joue avec la
# même physique, quels que soient les scr.ini des joueurs. Relancez le serveur après modification.

port = 27420                  # port TCP d'écoute (à reporter dans scr.ini des joueurs : relais = adresse:port)

# --- physique (1 = valeur du jeu d'origine)
gravity = 1                   # gravité
thrust = 1                    # poussée du moteur
brake = 1                     # freinage
timestep = 1                  # pas de temps de la physique (vitesse du jeu)
damping = 1                   # amortissement
boostuse = 1                  # consommation du boost (2 = deux fois plus vite)
shock = 0                     # tolérance aux chocs (dégâts)

# --- réseau
reseau_cadence = 400          # échanges réseau par seconde dans les jeux (50 à 2000) : plus haut = moins de lag
