# Stunt Car Racer : publication d'une release GitHub au push d'un tag scr-vNN.
# Les zips (jeu Windows et serveur relais) sont pris dans le commit du tag, dossier
# stunt_car_racer/release/ (commit porté seulement par le tag, pas par la branche).
name: Stunt Car Racer release

on:
  push:
    tags: ["scr-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sommes SHA256
        run: cd stunt_car_racer/release && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: Stunt Car Racer ${{ github.ref_name }}
          body_path: stunt_car_racer/release/NOTES.md
          files: |
            stunt_car_racer/release/*.zip
            stunt_car_racer/release/SHA256SUMS.txt
