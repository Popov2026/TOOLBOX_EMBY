# Nettoyage : la release Stunt Car Racer scr-v70 publiée ici par erreur (elle est dans le dépôt
# stuntcar-racer) est supprimée avec son tag. Fichier retiré au commit suivant.
name: Stunt Car Racer release (nettoyage)

on:
  push:
    paths: [".github/workflows/stunt_car_racer_release.yml"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - run: gh release delete scr-v70 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
